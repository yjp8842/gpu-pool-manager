# 설계도 4장 3번: GKE MIG 노드에서 조각 하나를 받는 Pod. 예약 응답과 같은 모양(nvidia.com/gpu 1 + 노드 라벨)이다.
#   kubectl apply -f test/gke/mig-check-pod.yaml
#   kubectl logs mig-check          # GPU 1장과 MIG 장치 1개가 보여야 한다
#   kubectl delete pod mig-check
# 떠 있는 동안 dcgm-exporter /metrics의 조각 한 줄에 pod="mig-check" 라벨이 붙어야 한다 (4장 4번).
apiVersion: v1
kind: Pod
metadata:
  name: mig-check
  namespace: default
  labels:
    app: mig-check
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-gpu-partition-size: 1g.5gb
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: main
      image: nvidia/cuda:12.6.3-base-ubuntu24.04
      command: ["sh", "-c", "nvidia-smi -L && nvidia-smi && sleep 3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
