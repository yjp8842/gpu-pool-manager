# 서버1이 읽는 주소. DCGM_ENDPOINTS=http://dcgm-exporter:9400/metrics
# GPU 노드가 한 대라 Service 하나로 충분하다. 노드가 늘면 ClusterIP가 한 Pod만 고르므로,
# 서버1이 Pod 목록에서 주소를 찾는 방식으로 바꿔야 한다.
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  labels:
    app: dcgm-exporter
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
