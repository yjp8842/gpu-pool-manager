# 화면. nginx가 정적 파일을 내주고 /api·/healthz를 서버2로 넘긴다.
# 외부 IP는 열지 않는다 (서버2에 인증이 없음, 설계도 10장 5번). 접속은 kubectl port-forward svc/web 8080:80 으로 한다.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: gpu-pool/web
          imagePullPolicy: IfNotPresent
          env:
            # nginx가 /api를 넘길 서버2 주소 (같은 네임스페이스의 Service)
            - name: API_UPSTREAM
              value: api:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
