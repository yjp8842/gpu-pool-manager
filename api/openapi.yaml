openapi: 3.0.3
info:
  title: GRIM GPU Pool API
  description: |
    서버2(조회·예약 서비스) API 명세. Go 서버 코드(oapi-codegen)와 화면 타입(openapi-typescript)의 생성 원본이다.
    조회 API는 개발 단계 4, 예약 API는 단계 5에서 만들었다. 대상 워크로드는 Pod만 다룬다.

    - 목록 응답은 모두 `{ "items": [...] }` 형태다.
    - 상태 값은 장부와 같은 대문자 값이다 (예: `FREE`, `ALLOCATED`).
    - 시각은 RFC 3339 형식이다.
    - 오류 응답은 `{ "code": "...", "message": "..." }` 형태다.
  version: 0.5.0
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 서비스 상태 확인
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: 노드 목록 (화면의 노드 상태, GPU 노드 구성)
      responses:
        "200":
          description: 노드 목록. 이름순
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/gpus:
    get:
      operationId: listGPUs
      summary: 컨테이너용 GPU 카드 목록과 카드별 조각 (화면의 카드별 MIG 분할)
      parameters:
        - $ref: "#/components/parameters/NodeQuery"
      responses:
        "200":
          description: 카드 목록. 노드, 카드 번호순
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPUList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/instances:
    get:
      operationId: listInstances
      summary: 나눠진 조각 목록
      parameters:
        - $ref: "#/components/parameters/NodeQuery"
        - $ref: "#/components/parameters/ProfileQuery"
        - name: state
          in: query
          description: 조각 상태로 거른다
          schema:
            $ref: "#/components/schemas/InstanceState"
      responses:
        "200":
          description: 조각 목록. 노드, 카드 번호, GI ID순
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/capacity:
    get:
      operationId: listCapacity
      summary: 노드 + 프로파일별 남은 수량
      description: |
        남은 수량(available) = 빈 조각 수(free) − 확정 전 예약 수(reserved). 0보다 작으면 0이다.
        빈 조각은 건강 상태가 OK이고 할당되지 않은 조각이다.
      parameters:
        - $ref: "#/components/parameters/NodeQuery"
        - $ref: "#/components/parameters/ProfileQuery"
      responses:
        "200":
          description: 노드 + 프로파일별 수량. 노드, 프로파일순
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workloads:
    get:
      operationId: listWorkloads
      summary: GPU를 요청한 Pod 목록 (화면의 Pod들)
      responses:
        "200":
          description: 워크로드 목록. 네임스페이스, 이름순
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadList"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events:
    get:
      operationId: listEvents
      summary: 이력 (최근 것부터)
      parameters:
        - name: limit
          in: query
          description: 돌려줄 최대 개수
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          description: 이 ID보다 앞선 이력만 돌려준다. 이전 응답의 nextBefore를 넣으면 다음 쪽을 받는다
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 이력. 최근 것부터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/reservations:
    get:
      operationId: listReservations
      summary: 예약 목록 (화면의 진행 중인 예약)
      description: 예약 경로로 만든 행을 최근 것부터 돌려준다. state가 없으면 진행 중인 것(RESERVED, ALLOCATED)만 돌려준다.
      parameters:
        - name: state
          in: query
          description: 상태로 거른다
          schema:
            $ref: "#/components/schemas/AllocationState"
        - name: limit
          in: query
          description: 돌려줄 최대 개수
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 예약 목록. 최근 것부터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createReservation
      summary: 노드 + 프로파일 단위 예약
      description: |
        남은 수량이 1 이상이면 예약하고, Pod에 쓸 자원 이름(resourceName), 노드 라벨(nodeSelector),
        만료 시각을 돌려준다. 요청자는 이 자원 이름과 노드 라벨로 target Pod를 만든다. Pod가 그 노드의 같은 프로파일 조각에서 관측되면
        정합 작업이 예약을 그 조각에 묶는다(state ALLOCATED). 확정 없이 만료 시각이 지나면 EXPIRED가 된다.

        같은 requestId로 같은 내용을 다시 보내면 처음 예약을 200으로 돌려준다.
        남은 수량이 0이면 409(no_capacity)이고, 거부도 이력에 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRequest"
      responses:
        "201":
          description: 새로 만든 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "200":
          description: 같은 requestId로 이미 만든 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 예약(할당) ID
        schema:
          type: string
          format: uuid
    get:
      operationId: getReservation
      summary: 예약 상태와 확정된 조각
      description: 관측 할당(source OBSERVED)의 ID로도 조회할 수 있다.
      responses:
        "200":
          description: 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: cancelReservation
      summary: 취소 또는 반납
      description: |
        확정 전 예약은 취소(CANCELLED)하고, 할당 중이면 반납(RELEASED)한다. 이미 닫혔으면 지금 상태를 그대로 돌려준다.
        반납한 조각을 Pod가 계속 쓰고 있으면 다음 정합 작업이 관측 할당으로 다시 잡는다.
      responses:
        "200":
          description: 취소·반납 뒤의 예약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    NodeQuery:
      name: node
      in: query
      description: 노드 이름으로 거른다
      schema:
        type: string
    ProfileQuery:
      name: profile
      in: query
      description: 프로파일로 거른다 (예 1g.5gb, 나누지 않은 GPU는 full)
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청 값
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 없는 ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 남은 수량이 없거나(no_capacity), 같은 requestId로 다른 내용을 요청했다(request_id_conflict)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 오류 종류 (bad_request, not_found, no_capacity, request_id_conflict, internal)
          example: bad_request
        message:
          type: string

    InstanceHealth:
      type: string
      description: 조각 건강 상태
      enum: [OK, UNHEALTHY, UNKNOWN]

    InstanceState:
      type: string
      description: |
        조각 상태. ALLOCATED는 할당 행이 있는 조각, UNHEALTHY는 건강 상태가 OK가 아닌 조각, FREE는 나머지다.
        노드 + 프로파일 단위 예약은 조각에 묶이지 않으므로 조각 상태에 나타나지 않는다 (capacity의 reserved).
      enum: [FREE, ALLOCATED, UNHEALTHY]

    WorkloadKind:
      type: string
      description: 워크로드 종류. 지금은 Pod만 다룬다
      enum: [POD]

    AllocationSource:
      type: string
      description: 할당 출처. RESERVATION은 예약을 거친 것, OBSERVED는 예약 없이 관측된 것
      enum: [RESERVATION, OBSERVED]

    EventType:
      type: string
      enum:
        - RESERVED
        - ALLOCATED
        - RELEASED
        - EXPIRED
        - CANCELLED
        - REJECTED
        - MIG_RECONFIGURED

    AllocationState:
      type: string
      description: |
        예약·할당 상태. RESERVED 확정 전 예약, ALLOCATED 조각에 묶임, RELEASED 반납,
        EXPIRED 확정 없이 만료, CANCELLED 확정 전 취소
      enum: [RESERVED, ALLOCATED, RELEASED, EXPIRED, CANCELLED]

    ReservationRequest:
      type: object
      required: [requestId, requester, node, profile, target]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: 요청자가 정한 ID. 같은 ID로 다시 보내면 처음 예약을 돌려준다
        requester:
          type: string
          minLength: 1
          description: 요청한 사람·시스템 (이력의 "누구")
        node:
          type: string
          minLength: 1
        profile:
          type: string
          minLength: 1
          description: MIG 프로파일 또는 full (나누지 않은 GPU)
          example: 1g.5gb
        target:
          description: 이 예약으로 만들 Pod (kind는 POD)
          allOf:
            - $ref: "#/components/schemas/WorkloadRef"

    Reservation:
      type: object
      description: 예약 또는 할당 한 건 (장부의 allocation 행)
      required:
        [id, source, state, requestId, requester, node, profile, resourceName, nodeSelector, target,
         instance, reservedAt, expiresAt, allocatedAt, endedAt, capacityShort]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/AllocationSource"
        state:
          $ref: "#/components/schemas/AllocationState"
        requestId:
          type: string
          nullable: true
          description: 관측 할당은 null
        requester:
          type: string
          nullable: true
        node:
          type: string
        profile:
          type: string
        resourceName:
          $ref: "#/components/schemas/ResourceName"
        nodeSelector:
          $ref: "#/components/schemas/NodeSelector"
        target:
          $ref: "#/components/schemas/WorkloadRef"
        instance:
          description: 묶인 조각. 확정 전이거나 조각이 사라졌으면 null
          allOf:
            - $ref: "#/components/schemas/InstanceRef"
          nullable: true
        reservedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 이 시각까지 확정되지 않으면 만료된다
        allocatedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: 반납·만료·취소 시각
        capacityShort:
          type: boolean
          description: |
            확정 전 예약인데 빈 조각이 모자라 차례가 오지 않음 (용량 부족). 예약 없는 Pod가 조각을 가져가면
            노드 + 프로파일마다 가장 늦게 만든 예약부터 true가 된다

    ReservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"

    Node:
      type: object
      required:
        [name, ready, instanceType, lastSeenAt, gpuCount, instanceCount, freeInstanceCount]
      properties:
        name:
          type: string
        ready:
          type: boolean
          nullable: true
          description: K8s Ready 조건. K8s에서 아직 읽지 못했으면 null
        instanceType:
          type: string
          nullable: true
          example: a2-highgpu-1g
        lastSeenAt:
          type: string
          format: date-time
        gpuCount:
          type: integer
          description: GPU 카드 수
        instanceCount:
          type: integer
          description: 조각 수 (나누지 않은 GPU는 1개로 센다)
        freeInstanceCount:
          type: integer
          description: 빈 조각 수 (건강 OK, 할당 없음). 확정 전 예약은 빼지 않은 값이다

    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"

    PodRef:
      type: object
      required: [namespace, name, container]
      properties:
        namespace:
          type: string
        name:
          type: string
        container:
          type: string
          nullable: true

    WorkloadRef:
      type: object
      required: [kind, namespace, name]
      properties:
        kind:
          $ref: "#/components/schemas/WorkloadKind"
        namespace:
          type: string
        name:
          type: string

    InstanceAllocation:
      type: object
      description: 조각에 묶인 할당 (state = ALLOCATED)
      required: [id, source, target, allocatedAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/AllocationSource"
        target:
          $ref: "#/components/schemas/WorkloadRef"
        allocatedAt:
          type: string
          format: date-time

    Instance:
      type: object
      description: 할당 단위 하나. MIG 조각이거나 나누지 않은 GPU 전체(profile full, giId 0)다
      required:
        [id, node, gpuUuid, gpuIndex, giId, profile, memoryMb, migUuid, health, state,
         observedPod, allocation, lastSeenAt, missedCount]
      properties:
        id:
          type: integer
          format: int64
        node:
          type: string
        gpuUuid:
          type: string
          example: GPU-5a1c...
        gpuIndex:
          type: integer
        giId:
          type: integer
        profile:
          type: string
          example: 1g.5gb
        memoryMb:
          type: integer
          nullable: true
        migUuid:
          type: string
          nullable: true
          description: 현재 MIG UUID. 다시 나누면 바뀐다. 나누지 않은 GPU는 null
        health:
          $ref: "#/components/schemas/InstanceHealth"
        state:
          $ref: "#/components/schemas/InstanceState"
        observedPod:
          description: DCGM에서 이 조각을 쓰는 것으로 관측된 Pod. 없으면 null
          allOf:
            - $ref: "#/components/schemas/PodRef"
          nullable: true
        allocation:
          description: 이 조각에 묶인 할당. 없으면 null
          allOf:
            - $ref: "#/components/schemas/InstanceAllocation"
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
        missedCount:
          type: integer
          description: 연속 미관측 횟수. 0이 아니면 최근 수집에서 보이지 않았다

    InstanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instance"

    GPU:
      type: object
      description: 컨테이너용 GPU 카드 한 장과 그 카드의 조각
      required:
        [uuid, node, index, model, memoryMb, migEnabled, totalSlices, lastXid, lastSeenAt, missedCount, instances]
      properties:
        uuid:
          type: string
        node:
          type: string
        index:
          type: integer
        model:
          type: string
          example: NVIDIA A100-SXM4-40GB
        memoryMb:
          type: integer
          nullable: true
        migEnabled:
          type: boolean
          nullable: true
          description: MIG 모드. 메트릭에 없으면 null
        totalSlices:
          type: integer
          nullable: true
          description: 모델별 MIG 최대 조각 칸 수 (A100·B200 7, RTX PRO 6000 4). 표에 없는 모델은 null
        lastXid:
          type: integer
          nullable: true
          description: 마지막 XID 오류 코드
        lastSeenAt:
          type: string
          format: date-time
        missedCount:
          type: integer
        instances:
          type: array
          description: 이 카드의 조각. GI ID순
          items:
            $ref: "#/components/schemas/Instance"

    GPUList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GPU"

    ResourceName:
      type: string
      description: |
        Pod가 요청할 K8s 자원 이름. GKE MIG 노드 풀에서는 조각도 nvidia.com/gpu이고,
        조각 크기는 nodeSelector의 노드 라벨로 고른다. 한 Pod는 조각 하나까지만 쓸 수 있다.
      example: nvidia.com/gpu

    NodeSelector:
      type: object
      description: |
        Pod의 nodeSelector에 넣을 노드 라벨. MIG 프로파일이면 GKE가 MIG 노드 풀에 붙이는
        cloud.google.com/gke-gpu-partition-size 라벨이다. 나누지 않은 GPU(profile full)는 빈 객체다.
      additionalProperties:
        type: string
      example:
        cloud.google.com/gke-gpu-partition-size: 1g.5gb

    Capacity:
      type: object
      required: [node, profile, resourceName, nodeSelector, total, free, reserved, available]
      properties:
        node:
          type: string
        profile:
          type: string
        resourceName:
          $ref: "#/components/schemas/ResourceName"
        nodeSelector:
          $ref: "#/components/schemas/NodeSelector"
        total:
          type: integer
          description: 조각 수
        free:
          type: integer
          description: 빈 조각 수 (건강 OK, 할당 없음)
        reserved:
          type: integer
          description: 확정 전 예약 수
        available:
          type: integer
          description: 남은 수량 = free − reserved (0 이상)

    CapacityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Capacity"

    InstanceRef:
      type: object
      required: [id, gpuUuid, gpuIndex, giId, profile]
      properties:
        id:
          type: integer
          format: int64
        gpuUuid:
          type: string
        gpuIndex:
          type: integer
        giId:
          type: integer
        profile:
          type: string

    Workload:
      type: object
      required: [kind, namespace, name, uid, node, phase, instances, lastSeenAt]
      properties:
        kind:
          $ref: "#/components/schemas/WorkloadKind"
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
          nullable: true
        node:
          type: string
          nullable: true
          description: 아직 노드가 정해지지 않았으면 null
        phase:
          type: string
          description: Pod phase (삭제 중이면 Terminating)
          example: Running
        instances:
          type: array
          description: 이 워크로드가 쓰는 조각. DCGM 관측 Pod이거나 할당 대상인 조각
          items:
            $ref: "#/components/schemas/InstanceRef"
        lastSeenAt:
          type: string
          format: date-time

    WorkloadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workload"

    Event:
      type: object
      description: 이력 한 줄. 당시 값을 그대로 남긴 것이라 지금 장부와 다를 수 있다
      required:
        [id, occurredAt, event, node, gpuUuid, giId, profile, migUuid, workload,
         requester, requestId, allocationId, message]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/EventType"
        node:
          type: string
          nullable: true
        gpuUuid:
          type: string
          nullable: true
        giId:
          type: integer
          nullable: true
        profile:
          type: string
          nullable: true
        migUuid:
          type: string
          nullable: true
        workload:
          allOf:
            - $ref: "#/components/schemas/WorkloadRef"
          nullable: true
        requester:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        allocationId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          nullable: true

    EventList:
      type: object
      required: [items, nextBefore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        nextBefore:
          type: integer
          format: int64
          nullable: true
          description: 다음 쪽을 받을 때 before에 넣을 값. 더 없으면 null
