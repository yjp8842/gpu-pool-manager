# oapi-codegen 설정. make gen이 api/openapi.yaml에서 internal/httpapi/api.gen.go를 만든다.
# 출력 경로는 Makefile이 -o로 넘긴다 (gen-check는 다른 경로에 만들어 비교한다).
package: httpapi
generate:
  std-http-server: true # Go 표준 net/http ServeMux 라우팅
  strict-server: true   # 요청·응답을 명세의 타입으로 주고받는 인터페이스
  models: true
  embedded-spec: true   # 테스트에서 응답을 명세로 검사할 때 쓴다
output-options:
  name-normalizer: ToCamelCaseWithInitialisms # GpuUuid 대신 GPUUUID처럼 Go 관례 이름
